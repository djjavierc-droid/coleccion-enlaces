name: Build (Fase 1)

# Compila y prueba el proyecto base. Sin puertos locales:
# Gradle corre solo en este runner de GitHub Actions.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - name: JDK 17 (Temurin)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # El código de clasificación referencia el archivo de palabras
      # clave sensibles, que NUNCA se commitea: se genera aquí desde el
      # secreto XXX_KEYWORDS_B64 (base64 del contenido del archivo).
      # El contenido del secreto no se imprime en ningún log. Si el
      # secreto no existe, el build falla (comportamiento correcto).
      - name: Generar archivo de palabras clave sensibles
        env:
          XXX_KEYWORDS_B64: ${{ secrets.XXX_KEYWORDS_B64 }}
        run: |
          if [ -z "$XXX_KEYWORDS_B64" ]; then echo "Falta el secreto XXX_KEYWORDS_B64" >&2; exit 1; fi
          echo "$XXX_KEYWORDS_B64" | base64 -d > app/src/main/java/com/coleccionenlaces/app/domain/XxxKeywords.kt

      - name: Android SDK (API 36)
        run: |
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Pruebas unitarias
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Compilar APK de depuración
        run: |
          ./gradlew assembleDebug --stacktrace
          ls -lh app/build/outputs/apk/debug/

      - name: Subir APK de depuración
        uses: actions/upload-artifact@v5
        with:
          name: coleccion-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
